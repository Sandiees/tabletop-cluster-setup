# Cluster configuration
ClusterName=raspberry-pi-cluster
SlurmctldHost=master-node

# Authentication
AuthType=auth/munge
CredType=cred/munge

# User running Slurm
SlurmUser=slurm

# State and spool directories
StateSaveLocation=/var/lib/slurm/slurmctld
SlurmdSpoolDir=/var/lib/slurm/slurmd

# Scheduling
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Logging
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# Compute nodes
NodeName=compute-node-01 NodeAddr=10.42.0.2 CPUs=4 RealMemory=850 State=UNKNOWN
NodeName=compute-node-02 NodeAddr=10.42.0.3 CPUs=4 RealMemory=850 State=UNKNOWN
NodeName=compute-node-03 NodeAddr=10.42.0.4 CPUs=4 RealMemory=850 State=UNKNOWN
NodeName=compute-node-04 NodeAddr=10.42.0.5 CPUs=4 RealMemory=850 State=UNKNOWN

# Compute partition
PartitionName=compute Nodes=compute-node-[01-04] Default=YES MaxTime=INFINITE State=UP