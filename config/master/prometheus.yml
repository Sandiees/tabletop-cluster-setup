global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "master"
    static_configs:
      - targets:
          - "localhost:9100"
        labels:
          role: "master"

  - job_name: "compute-nodes"
    static_configs:
      - targets:
          - "10.42.0.2:9100"
          - "10.42.0.3:9100"
          - "10.42.0.4:9100"
          - "10.42.0.5:9100"
        labels:
          role: "compute"